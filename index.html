<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Universo - Alejandro & Maite</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    body {
      background-color: #020005;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .info-overlay {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff99dd;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 0 15px #ff007f;
      z-index: 10;
    }

    .info-overlay h1 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="info-overlay">
    <h1>Nuestro Universo</h1>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Ángulo de inclinación 3D para la galaxia
    const TILT_ANGLE = 1.1; // Inclinación en eje X (perspectiva)
    const CAMERA_DIST = 600;

    let rotationAngle = 0;

    // --- 1. PARTÍCULAS DE LA GALAXIA ESPIRAL ---
    const GALAXY_PARTICLES = 1500;
    const galaxyParticles = [];

    for (let i = 0; i < GALAXY_PARTICLES; i++) {
      const radius = Math.pow(Math.random(), 1.5) * 450 + 30;
      const arms = 3;
      const armAngle = ((i % arms) * (2 * Math.PI / arms));
      const spiralAngle = radius * 0.012;
      const angle = armAngle + spiralAngle + (Math.random() - 0.5) * 0.5;

      galaxyParticles.push({
        x: Math.cos(angle) * radius,
        y: (Math.random() - 0.5) * 20, // grosor de la galaxia
        z: Math.sin(angle) * radius,
        radius: radius,
        angle: angle,
        size: Math.random() * 2 + 0.5,
        color: ['#ff1493', '#ff69b4', '#ff8da1', '#ffffff', '#e066ff', '#ff007f'][Math.floor(Math.random() * 6)]
      });
    }

    // --- 2. CORAZÓN CENTRAL DE PARTÍCULAS ---
    const HEART_PARTICLES = 400;
    const heartParticles = [];

    for (let i = 0; i < HEART_PARTICLES; i++) {
      const t = Math.random() * Math.PI * 2;
      // Fórmula matemática de corazón
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      
      const scale = 4.5 + Math.random() * 0.8;
      heartParticles.push({
        baseX: hx * scale,
        baseY: hy * scale - 120, // Elevado sobre el centro
        baseZ: (Math.random() - 0.5) * 30,
        size: Math.random() * 2.5 + 1,
        sparkle: Math.random() * Math.PI
      });
    }

    // --- 3. TEXTOS Y CORAZONES ORBITANDO EN 3D ---
    const phrases = [
      "ALEJANDRO",
      "MAITE",
      "AMOR DE MI VIDA",
      "NUESTRO UNIVERSO",
      "TU Y YO",
      "TE AMO",
      "ALEJANDRO",
      "MAITE",
      "SIEMPRE JUNTOS"
    ];

    const orbitingElements = phrases.map((text, i) => {
      const angle = (i / phrases.length) * Math.PI * 2;
      const radius = 220 + (i % 3) * 70;
      return {
        text: text,
        radius: radius,
        angle: angle,
        speed: 0.004 + (i % 2) * 0.002,
        isHeart: i % 4 === 0
      };
    });

    // Proyección 3D a 2D
    function project3D(x, y, z) {
      // Inclinación en X
      const cosT = Math.cos(TILT_ANGLE);
      const sinT = Math.sin(TILT_ANGLE);

      const y1 = y * cosT - z * sinT;
      const z1 = y * sinT + z * cosT;

      const scale = CAMERA_DIST / (CAMERA_DIST + z1);
      return {
        screenX: width / 2 + x * scale,
        screenY: height / 2 + y1 * scale,
        scale: scale,
        zDepth: z1
      };
    }

    // Dibujar forma de corazón en canvas
    function drawHeartShape(ctx, x, y, size, color) {
      ctx.save();
      ctx.translate(x, y - size / 2);
      ctx.beginPath();
      const top = size * 0.3;
      ctx.moveTo(0, top);
      ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, top);
      ctx.bezierCurveTo(-size / 2, (size + top) / 2, 0, size, 0, size);
      ctx.bezierCurveTo(0, size, size / 2, (size + top) / 2, size / 2, top);
      ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, top);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.shadowBlur = size * 1.5;
      ctx.shadowColor = color;
      ctx.fill();
      ctx.restore();
    }

    // Bucle de renderizado
    function animate() {
      rotationAngle += 0.003;

      // Fondo oscuro espacial
      ctx.fillStyle = 'rgba(2, 0, 5, 0.25)';
      ctx.fillRect(0, 0, width, height);

      // Resplandor rosado central (Agujero negro/núcleo)
      const coreGradient = ctx.createRadialGradient(width/2, height/2 + 30, 10, width/2, height/2 + 30, 220);
      coreGradient.addColorStop(0, 'rgba(255, 0, 128, 0.8)');
      coreGradient.addColorStop(0.3, 'rgba(255, 20, 147, 0.3)');
      coreGradient.addColorStop(0.7, 'rgba(128, 0, 128, 0.1)');
      coreGradient.addColorStop(1, 'transparent');
      ctx.fillStyle = coreGradient;
      ctx.fillRect(0, 0, width, height);

      // Guardar todos los elementos para ordenarlos por profundidad Z
      const renderList = [];

      // A) Partículas de Galaxia
      galaxyParticles.forEach(p => {
        const curAngle = p.angle + rotationAngle;
        const x = Math.cos(curAngle) * p.radius;
        const z = Math.sin(curAngle) * p.radius;
        const proj = project3D(x, p.y, z);

        renderList.push({
          type: 'galaxy',
          zDepth: proj.zDepth,
          draw: () => {
            const size = p.size * proj.scale;
            if (size <= 0) return;
            ctx.beginPath();
            ctx.arc(proj.screenX, proj.screenY, size, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = size * 2;
            ctx.shadowColor = p.color;
            ctx.fill();
          }
        });
      });

      // B) Corazón Gigante de Partículas en el Centro
      heartParticles.forEach(p => {
        p.sparkle += 0.05;
        const pulse = Math.sin(p.sparkle) * 0.15 + 1;
        const x = p.baseX * pulse;
        const y = p.baseY * pulse;
        const z = p.baseZ;

        // Rotar ligeramente el corazón
        const hAngle = rotationAngle * 0.5;
        const rx = x * Math.cos(hAngle) - z * Math.sin(hAngle);
        const rz = x * Math.sin(hAngle) + z * Math.cos(hAngle);

        const proj = project3D(rx, y, rz);

        renderList.push({
          type: 'heart_particle',
          zDepth: proj.zDepth,
          draw: () => {
            const size = p.size * proj.scale * 1.2;
            if (size <= 0) return;
            ctx.beginPath();
            ctx.arc(proj.screenX, proj.screenY, size, 0, Math.PI * 2);
            ctx.fillStyle = '#ffb6c1';
            ctx.shadowBlur = size * 4;
            ctx.shadowColor = '#ff007f';
            ctx.fill();
          }
        });
      });

      // C) Elementos Orbitando (Textos "ALEJANDRO", "MAITE", etc.)
      orbitingElements.forEach(item => {
        item.angle += item.speed;
        const x = Math.cos(item.angle) * item.radius;
        const z = Math.sin(item.angle) * item.radius;
        const proj = project3D(x, -20, z);

        renderList.push({
          type: 'text',
          zDepth: proj.zDepth,
          draw: () => {
            const fontSize = Math.max(8, 18 * proj.scale);
            ctx.save();
            ctx.translate(proj.screenX, proj.screenY);

            if (item.isHeart) {
              drawHeartShape(ctx, 0, 0, 16 * proj.scale, '#ff1493');
            }

            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#ff007f";
            ctx.fillText(item.text, 0, item.isHeart ? -18 * proj.scale : 0);
            ctx.restore();
          }
        });
      });

      // Ordenar por Z (profundidad 3D) para rendering correcto
      renderList.sort((a, b) => b.zDepth - a.zDepth);

      // Dibujar todo en orden
      renderList.forEach(item => item.draw());

      requestAnimationFrame(animate);
    }

    animate();
  </script>
  <audio id="bg-music" loop autoplay>
  <source src="música.mp3" type="audio/mpeg">
</audio>

<script>
  document.addEventListener('click', function() {
    var audio = document.getElementById('bg-music');
    if (audio.paused) {
      audio.play();
    }
  }, { once: true });
</script>
</body>
</html>
